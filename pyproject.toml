[build-system]
requires = ["uv_build==0.11.13"]
build-backend = "uv_build"

[project]
name = "federated-data-management-portal"
version = "3.0.0"
description = "Dash dashboard for federated data management summaries."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
dependencies = [
    "dash==4.4.1",
    "dash-bootstrap-components==2.0.4",
    "pandas==3.0.6",
    "plotly==7.1.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "bandit==1.9.4",
    "safety==3.8.1",
]
