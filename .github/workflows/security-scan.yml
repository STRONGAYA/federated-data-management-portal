name: Weekly security scan

on:
  schedule:
    # Mondays at 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        # https://github.com/actions/checkout/releases/tag/v7.0.0
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Install the pinned uv binary
        # https://github.com/astral-sh/uv/releases/tag/0.11.24
        run: |
          curl -LsSf -o /tmp/uv.tar.gz \
            https://github.com/astral-sh/uv/releases/download/0.11.24/uv-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf /tmp/uv.tar.gz -C /tmp
          install /tmp/uv-x86_64-unknown-linux-gnu/uv /usr/local/bin/uv

      - name: Install the locked dependencies
        run: uv sync --frozen --group dev

      - name: Export the runtime dependencies
        run: uv export --frozen --no-dev -o requirements.txt

      - name: Scan the source for security issues
        run: uv run --no-sync bandit -r src -ll

      - name: Scan the dependencies for known vulnerabilities
        # safety check is deprecated upstream in favour of `safety scan`,
        # which requires a Safety organisation account; `check` remains the
        # account-free option for scheduled CI.
        run: uv run --no-sync safety check -r requirements.txt

  report:
    name: File a private draft security advisory on failure
    needs: [security-scan]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    # The built-in GITHUB_TOKEN cannot create repository security advisories:
    # no GITHUB_TOKEN permission covers them (security-events is code
    # scanning only). The job therefore gets no GITHUB_TOKEN permissions and
    # mints a short-lived token from the organisation's GitHub App instead
    # ("Repository security advisories: read and write"); the token is scoped
    # to this repository and revoked when the job ends. The App's client ID
    # is the SECURITY_ADVISORY_APP_CLIENT_ID variable and its private key the
    # SECURITY_ADVISORY_APP_PRIVATE_KEY secret. The advisory is created as a
    # private draft and stays one until a human deliberately publishes it —
    # scan output must never become a public issue.
    permissions: {}
    steps:
      - name: Check that the App credentials are configured
        env:
          CLIENT_ID: ${{ vars.SECURITY_ADVISORY_APP_CLIENT_ID }}
          PRIVATE_KEY: ${{ secrets.SECURITY_ADVISORY_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ -z "$PRIVATE_KEY" ]; then
            echo "::error::The SECURITY_ADVISORY_APP_CLIENT_ID variable or the SECURITY_ADVISORY_APP_PRIVATE_KEY secret is not set, so no draft advisory was filed."
            exit 1
          fi

      - name: Mint a short-lived advisory token for this repository
        id: app-token
        # https://github.com/actions/create-github-app-token/releases/tag/v3.3.0
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SECURITY_ADVISORY_APP_CLIENT_ID }}
          private-key: ${{ secrets.SECURITY_ADVISORY_APP_PRIVATE_KEY }}
          permission-repository-advisories: write

      - name: Create or update the draft security advisory
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOBS: "security-scan=${{ needs.security-scan.result }}"
        run: |
          SUMMARY="Weekly security scan failed"
          RUN_LINE="- ${RUN_URL} (${JOBS})"
          DESCRIPTION="The weekly security scan failed. Each failed run is listed
          below; open a run for the scanner output.

          Policy: triage within one working week. Failures on HIGH/CRITICAL with
          a fix available require a dependency bump (uv.lock), tests and a
          patch tag (v*); the advisory is published only after the finding is
          fixed and released. Suppressions must be committed with a
          justification and an expiry date.

          The affected product and the severity are placeholders the API
          requires; set both during triage. This advisory is a private draft:
          do not publish it before the finding is fixed and released, and never
          mirror it into a public issue.

          Failed runs:

          ${RUN_LINE}"
          # Re-use the open draft so repeated failures append to one advisory
          # instead of piling up new ones.
          GHSA=$(gh api "repos/${GH_REPO}/security-advisories?state=draft&per_page=100" \
            | jq -r --arg summary "$SUMMARY" '[.[] | select(.summary == $summary)] | .[0].ghsa_id // empty')
          if [ -n "$GHSA" ]; then
            CURRENT=$(gh api "repos/${GH_REPO}/security-advisories/${GHSA}" --jq '.description')
            jq -n --arg description "${CURRENT}"$'\n'"${RUN_LINE}" '{description: $description}' \
              | gh api -X PATCH "repos/${GH_REPO}/security-advisories/${GHSA}" --input - --silent
          else
            # The API requires an affected product and a severity; both are
            # placeholders that triage replaces.
            jq -n --arg summary "$SUMMARY" --arg description "$DESCRIPTION" --arg name "$GH_REPO" \
              '{summary: $summary, description: $description, severity: "high",
                vulnerabilities: [{package: {ecosystem: "other", name: $name}}]}' \
              | gh api -X POST "repos/${GH_REPO}/security-advisories" --input - --silent
          fi
